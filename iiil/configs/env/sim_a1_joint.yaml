# @package _global_

defaults:
  - _self_ 
  - override /robot: a1_iiil

env:
  env_type: sim
  cfg:
    env: 
      action_frequency: 30
      rendering_frequency: 30
      physics_frequency: 120
      flatten_obs_space: true
      external_sensors:                     
        - sensor_type: VisionSensor
          name: external_camera
          relative_prim_path: /external_camera
          modalities: [rgb]
          sensor_kwargs:
            image_height: 240
            image_width: 240
          position: [0.7, 0.0, 0.6]
          orientation: [0.255, 0.255, 0.66, 0.66]
          pose_frame: parent
        - sensor_type: VisionSensor
          name: wrist_camera
          relative_prim_path: /controllable__a1__robot/eef_link/wrist_camera
          modalities: [rgb]
          sensor_kwargs:
            image_height: 240
            image_width: 240
          position: [0.086, 0, -0.066]
          orientation: [0.652, 0.652, 0.274, 0.274]
          pose_frame: parent

    render:
      viewer_width: 1280
      viewer_height: 720

    scene:
      type: Scene
      use_skybox: false
      include_robots: false

    robots:
      - model: a1
        name: robot
        action_normalize: false
        grasping_mode: physical
        obs_modalities: [proprio, rgb]
        controller_config:
          arm_0:
            name: JointController
            motor_type: position
            use_impedances: false
            use_delta_commands: false
            command_input_limits: null
          gripper_0:
            name: MultiFingerGripperController
            mode: smooth
        position: [0.0, 0.0, 0.0]
        orientation: [0.0, 0.0, 0.0, 1.0]

    objects:
      - type: LightObject
        name: background_light
        prim_path: /World/background_light
        light_type: Dome
        intensity: 800
        orientation: [0.0, 0.793, 0.0, 0.609]
      - type: LightObject
        name: top_light
        prim_path: /World/top_light
        light_type: Distant
        intensity: 300

    task: ${task}