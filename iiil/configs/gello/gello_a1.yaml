# A1 Bilateral GELLO Configuration
# Single A1 arm (6 DOF)
# 3 high-powered servos (joints 0-2) and 3 low-powered servos (joints 3-5)

type: gello

# Controller type
bilateral_control_type: bilateral

# Control settings
control_frequency: 100  # Hz
driver_type: current  # Only current control for bilateral operation
debug: false

# Console debug messages (printed to terminal)
debug_messages:
  enable: false  # Opt in to console debug messages
  control_loop: false  # Control loop frequency updates (every 1 second)
  tracking: false  # ENV_TO_GELLO tracking mode messages (currents, errors)
  user_control: false  # GELLO_TO_ENV user control mode messages
  takeover: false  # Takeover detection messages (when user grabs gello)
  release: false  # Release detection / auto-return messages
  goal_reached: false  # Goal convergence messages

# Joint offsets in radians (additional to encoder zero at 180°)
# Rounded to nearest 0.1 rad for a clean zero pose.
joint_offsets: [-1.4, 0.8, 0.0, 1.5708, 1.3, 0.0]

# GELLO_TO_ENV mode configuration
# Controls torque behavior when user is directly controlling the arm
gello_to_env:
  torque_enabled: false  # true = apply gravity + anti-friction, false = free float

# Motor groups configuration
motor_groups:
  # High Power Servos (Joints 0-2)
  - motor_ids: [0, 1, 2]
    motor_type: "XM430-W350-T"
    robot_joint_indices: [0, 1, 2]
    arm_joint_signs: [1, 1, 1]
    device_port: "/dev/tty_large_motor"
    baudrate: 1000000
    max_joint_velocity: 0.7  # rad/s
    position_deadband: 3  # encoder ticks (~0.26°) — suppress writes near setpoint to prevent oscillation
    # current_limit: 500  # mA (optional, uncomment to limit current)

  # Low Power Servos (Joints 3-5)
  - motor_ids: [3, 4, 5]
    motor_type: "XC330-M288-T"
    robot_joint_indices: [3, 4, 5]
    arm_joint_signs: [1, 1, 1]
    device_port: "/dev/tty_small_motor"
    baudrate: 1000000
    max_joint_velocity: 0.7  # rad/s
    position_deadband: 3  # encoder ticks (~0.26°) — suppress writes near setpoint to prevent oscillation
    # current_limit: 300  # mA (optional, uncomment to limit current)

# Compensation configuration
compensation:
  # Gravity compensation using URDF dynamics
  gravity:
    enable: true
    urdf_path: "assets/gello_a1_urdf/6dof_arm.urdf"
    # Per-joint multipliers (tune these for your hardware)
    # Lowered small servo multipliers to reduce stiffness
    multipliers: [0.3, 0.5, 0.5, 0.0, 0.25, 0.0]

  # Static friction compensation (oscillating torques to overcome stiction)
  friction:
    enable: false
    speed_threshold: 0.0  # rad/s - velocity below which friction comp activates
    gain: 0.0  # Global gain multiplier

  # Anti-friction compensation (assists backdriving by applying torque in direction of motion)
  # Counteracts back-EMF resistance when motors are in current control mode
  # τ = viscous_gain × velocity + coulomb_gain × sign(velocity)
  # WARNING: If gains are too high, arm will accelerate on its own (positive feedback)
  anti_friction:
    enable: true
    viscous_gain: 0.015    # Nm/(rad/s) - velocity-proportional term (compensates back-EMF)
    coulomb_gain: 0.0      # Nm - constant friction term (set to 0 to avoid runaway)
    velocity_deadband: 0.05  # rad/s - prevents oscillation at rest
    # Optional per-joint gains (uncomment to override global gains)
    # per_joint_viscous_gains: [0.05, 0.08, 0.06, 0.02, 0.02, 0.01]
    # per_joint_coulomb_gains: [0.01, 0.02, 0.015, 0.005, 0.005, 0.003]

# Goal tracking configuration (for ENV_TO_GELLO and admittance modes)
goal_tracking:
  enable: true
  # PID gains for current-based position tracking
  kp: [0.2, 1.1, 1.1, 0.08, 0.15, 0.1]  # Proportional gains per joint
  ki: [0.01, 0.1, 0.1, 0.0, 0.0, 0.0]  # Integral gains per joint (start conservative)
  kd: [0.05, 0.1, 0.1, 0.0, 0.0, 0.0]  # Derivative gains per joint
  # Anti-windup settings
  integral_limit: 0.5  # Max integral accumulation (radians)
  reset_integral_on_goal_change: true  # Reset integral when goal changes significantly

  # Velocity feedforward control (reduces tracking lag)
  feedforward:
    enable: true                              # Master enable/disable flag
    kff: [0.1, 0.1, 0.1, 0.01, 0.01, 0.01]   # Velocity feedforward gains per joint
    velocity_filter_alpha: 0.3                # EMA smoothing for goal velocity (0-1, lower = smoother)

# Admittance stiffness override (applied when entering admittance mode)
# These override goal_tracking kp/ki/kd above for admittance-specific tuning.
# Leave as null to use the goal_tracking defaults above.
admittance_stiffness:
  kp: null
  ki: null
  kd: null

# Stiffness during human takeover/correction in admittance mode.
# Softer gains so GELLO is easy to move during human correction.
# When correction ends, reverts to admittance_stiffness (or goal_tracking defaults).
# Leave as null for no switching (same gains always).
takeover_stiffness:
  kp: null
  ki: null
  kd: null

# Capacitive touch sensor (ESP32-S3 + MPR121)
# Enable when hardware is connected. See iiil/gello/capacitive_sensor/README.md for setup.
touch_sensor:
  enable: false                      # Set to true when hardware is connected
  port: "/dev/tty_touch_sensor"      # USB serial port (see scripts/99-touch-sensor.rules)
  baudrate: 115200
  num_channels: 1                    # Number of active MPR121 channels
  reconnect_interval: 2.0            # Seconds between reconnection attempts
  stale_timeout: 0.5                 # Seconds after which data is considered stale

# Takeover detection
# NOTE: Enabled for admittance gating (uses detector for policy vs gello gate)
# Callbacks are disabled in admittance mode, so no mode switching will occur
takeover:
  enable: true

  # Touch sensor detection (set use_touch: true and disable current/position for touch-only mode)
  use_touch: false                   # Enable capacitive touch detection
  touch_release_cooldown: 0.5        # Seconds after touch release before returning to policy

  # Current filtering (4-stage pipeline: median → spike clamp → butterworth → EMA)
  current_filter:
    ema_enable: true   # Extra smoothing on top of Butterworth
    alpha: 0.2  # EMA smoothing factor (0-1): lower = more smoothing
    spike_median_enable: true   # Apply median filter to remove isolated spikes
    spike_median_window: 7  # Median filter window size (samples) - larger = more spike removal
    spike_clamp_enable: true    # Clamp per-sample current jumps
    spike_clamp_max: 30.0       # mA - max allowed current change per 10ms sample (tighter)
    # Butterworth low-pass filter (better noise rejection than EMA)
    butterworth_enable: true    # Enable 2nd-order Butterworth filter
    butterworth_cutoff: 4.5    # Cutoff frequency in Hz (very aggressive - only passes slow signals)
    butterworth_order: 2        # Filter order (2 recommended)

  # Position filtering (3-stage pipeline: median → spike clamp → EMA)
  position_filter:
    ema_enable: false  # EMA (alpha) smoothing on/off
    alpha: 0.3  # EMA smoothing factor (0-1)
    spike_median_enable: false  # Apply median filter to remove isolated spikes
    spike_median_window: 11  # Median filter window size (samples)
    spike_clamp_enable: false  # Clamp per-sample position jumps
    spike_clamp_max: 0.1  # rad - max allowed position change per 10ms sample

  # Velocity filtering (3-stage pipeline: median → spike clamp → EMA)
  velocity_filter:
    ema_enable: false  # EMA (alpha) smoothing on/off
    alpha: 0.3  # EMA smoothing factor (0-1)
    spike_median_enable: false  # Apply median filter to remove isolated spikes
    spike_median_window: 5  # Median filter window size (samples)
    spike_clamp_enable: false  # Clamp per-sample velocity jumps
    spike_clamp_max: 1.0  # rad/s - max allowed velocity change per 10ms sample

  # Which detection methods to use
  use_current: true
  use_position: true
  use_velocity: false

  # Thresholds
  current_threshold: [5.0, 5.0, 5.0, 5.0, 5.0, 5.0]  # mA per joint - excess current above expected
  position_threshold: [0.20, 0.3, 0.15, 0.2, 0.1, 0.2]  # rad per joint - position error thresholds
  velocity_threshold: 0.3   # rad/s - velocity threshold

  # Temporal filtering (sustained detection window)
  window_size: 20  # frames (200ms at 100Hz)

  # Auto-return (automatically resume tracking after release)
  enable_auto_return: true
  auto_return_timeout: 0.3  # seconds - wait time before auto-return
  release_velocity: 0.05    # rad/s - velocity must be below this
  release_current_derivative: 10.0  # mA - current std dev must be below this (stability check)
  takeover_grace_period: 0.2  # seconds - ignore takeover right after auto-return to let tracking settle

# Debug logging and visualization
debug_logging:
  enable: false  # Set to true to enable structured debug logging
  log_to_file: true
  log_directory: "logs/debug"
  buffer_size: 10000  # samples (100 seconds at 100 Hz)
  flush_interval: 10  # samples (flush every 0.1 seconds for real-time plotting)

  # Signals to capture (all logged at 100 Hz)
  # Available signals:
  #   measured_currents    - Actual motor currents from hardware (mA)
  #   tracking_currents    - Expected current from PD tracking controller (mA)
  #   gravity_currents     - Expected current from gravity compensation (mA)
  #   friction_currents    - Expected current from friction compensation (mA)
  #   expected_currents    - Sum of tracking + gravity + friction (mA)
  #   current_diff         - Measured - expected (disturbance indicator) (mA)
  #   filtered_current_diff - Low-pass filtered current difference (mA)
  #   position_error       - Absolute error from goal position (rad)
  #   velocities           - Joint velocities (rad/s)
  #   goal_position        - Target joint angles (rad)
  #   current_position     - Actual joint angles (rad)
  #   signed_position_error - Goal minus current (signed, rad)
  signals:
    - measured_currents
    - tracking_currents
    - gravity_currents
    - friction_currents
    - expected_currents
    - current_diff
    - filtered_current_diff
    - position_error
    - velocities
    - goal_position
    - current_position
    - signed_position_error

  # Real-time plotting configuration
  # Per-motor layout: one row per motor with 2 subplots
  #   - Left column: Measured, Tracking, Gravity currents
  #   - Right column: Expected current and Error
  plotting:
    enable: true  # Set to true for real-time visualization
    backend: "matplotlib"
    update_rate: 10  # Hz (5-10 Hz recommended for matplotlib)
    window_duration: 60.0  # seconds of data to display

    # Y-axis limits by signal type (fixed limits prevent scale jumping)
    y_limits:
      currents: [-150, 150]  # mA - fixed range for all current plots
      position_error: [-0.5, 0.5]  # radians
      velocities: [-2.0, 2.0]  # rad/s
