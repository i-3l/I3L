# @package _global_

arch_name: residual_rgb_r1pro
  
wandb_entity: I3L
wandb_project: IIIL

# ====== Policy specific ======
horizon: 2
num_latest_obs: 2
deployed_action_steps: 8

# ====== Policy Module ======
module:
  _target_: il_lib.policies.ResidualPolicy
  prop_dim: 23
  prop_keys: 
    - odom/base_velocity
    - qpos/torso
    - qpos/left_arm
    - qpos/left_gripper
    - qpos/right_arm
    - qpos/right_gripper
  # ====== Feature Extractors ======
  feature_extractors:
    proprioception:
      _target_: il_lib.nn.common.MLP
      input_dim: ${module.prop_dim}
      hidden_dim: 512
      output_dim: 512
      hidden_depth: 2
      add_output_activation: true
    rgb:
      _target_: il_lib.nn.features.MultiviewResNet18
      backbone: resnet18_gn
      views: 
        - robot::robot:left_realsense_link:Camera:0
        - robot::robot:right_realsense_link:Camera:0
        - robot::robot:zed_link:Camera:0
      resnet_output_dim: 512
      token_dim: 512
      use_shared_backbone: false
      load_pretrained: true
      include_depth: false
      enable_random_crop: true
      random_crop_size: 224
      return_last_spatial_map: false
  # ====== Feature Fusion ======
  feature_fusion_hidden_depth: 1
  feature_fusion_hidden_dim: 512
  feature_fusion_output_dim: 512
  feature_fusion_activation: relu
  feature_fusion_add_input_activation: false
  feature_fusion_add_output_activation: false
  # ====== Action ======
  action_dim: 23
  action_net_gmm_n_modes: 5
  action_net_hidden_dim: 128
  action_net_hidden_depth: 3
  action_net_activation: relu
  gmm_low_noise_eval: true
  action_keys: ${robot.action_keys}
  action_key_dims: ${robot.action_key_dims}
  # ====== Residual ======
  intervention_head_hidden_dim: 128
  intervention_head_hidden_depth: 3
  intervention_head_activation: relu
  deterministic_inference: true
  update_intervention_head_only: false
  ckpt_path_if_update_intervention_head_only: null
  optimizer: adam

data:
  dataset_class: iiil.datas.IIILDataset
  reweight_strategy: null
  use_action_chunks: false
  visual_obs_types: [rgb]
  use_task_info: false
  load_visual_obs_to_memory: true
  rank_based_partitioning: true
  downsample_factor: 1

trainer:
  use_distributed_sampler: ${eval:'not ${data.rank_based_partitioning}'}

policy_wrapper:
  base_policy: wbvima_r1pro
  base_policy_ckpt_path: null
