# @package _global_
# Simple MLP residual policy for Franka (RealFranka robot type)
# State-only features: proprioception (8D) + base_action (8D)

arch_name: simple_residual_franka

wandb_entity: I3L
wandb_project: IIIL

# ====== Policy specific ======
horizon: 1
num_latest_obs: 1
deployed_action_steps: 1

# ====== Policy Module ======
module:
  _target_: il_lib.policies.SimpleResidualPolicy
  prop_dim: 8
  prop_keys: [qpos/arm, qpos/gripper]
  # ====== Feature Extractors ======
  feature_extractors:
    proprioception:
      _target_: il_lib.nn.features.Identity
      input_dim: ${module.prop_dim}
    base_action:
      _target_: il_lib.nn.features.Identity
      input_dim: ${module.action_dim}
  # ====== Feature Fusion ======
  feature_fusion_hidden_depth: 1
  feature_fusion_hidden_dim: 256
  feature_fusion_output_dim: 256
  feature_fusion_activation: relu
  feature_fusion_add_input_activation: false
  feature_fusion_add_output_activation: false
  # ====== Action (simple MLP, no GMM) ======
  action_dim: 8
  action_net_hidden_dim: 128
  action_net_hidden_depth: 3
  action_net_activation: relu
  # ====== Intervention ======
  use_intervention_head: false
  intervention_loss_weight: 1.0
  # ====== Regularization ======
  supervise_zero_residual_off_intervention: true
  zero_residual_loss_weight: 1.0
  off_intervention_residual_l1_weight: 0.1
  optimizer: adam
  # ====== Base Policy ======
  base_policy: dp_franka
  base_policy_ckpt_path: null

data:
  dataset_class: iiil.datas.IIILDataset
  reweight_strategy: null
  use_action_chunks: false
  visual_obs_types: [rgb]
  use_task_info: false
  load_visual_obs_to_memory: true
  rank_based_partitioning: true
  downsample_factor: 1

trainer:
  use_distributed_sampler: ${eval:'not ${data.rank_based_partitioning}'}
