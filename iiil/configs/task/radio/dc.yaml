# @package _global_

mode: collection

task:
  type: RadioTask
  name: ${task.type}
  show_trajectory: false
  n_objects: 1
  randomize_robot_pose_prob: 1.0
  randomize_initial_pose_prob: 1.0
  is_target_fixed: false
  termination_config:
    hold_step_threshold: 20
    episode_timeout_step: 500
    total_episode: null
    total_successful_episode: 100